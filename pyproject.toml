[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piragi"
version = "0.7.8"
description = "The best RAG interface yet - Built-in vector store, embeddings, citations, and auto-updates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Hemanth HM", email = "hemanth.hm@users.noreply.github.com" }
]
keywords = ["rag", "retrieval", "embeddings", "vector-search", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "markitdown[all]>=0.0.1",
    "lancedb>=0.3.0",
    "openai>=1.0.0",
    "sentence-transformers>=2.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "transformers>=4.51.0",
    "torch>=2.0.0",
    "scikit-learn>=1.0.0",
    "pyarrow>=14.0.0",
    "pysbd>=0.3.4",
]

[project.optional-dependencies]
# Remote filesystems
s3 = ["fsspec>=2023.1.0", "s3fs>=2023.1.0"]
gcs = ["fsspec>=2023.1.0", "gcsfs>=2023.1.0"]
azure = ["fsspec>=2023.1.0", "adlfs>=2023.1.0"]
remote = ["fsspec>=2023.1.0", "s3fs>=2023.1.0", "gcsfs>=2023.1.0", "adlfs>=2023.1.0"]
# Vector stores
supabase = ["supabase>=2.0.0"]
pinecone = ["pinecone-client>=3.0.0"]
postgres = ["psycopg2-binary>=2.9.0", "pgvector>=0.2.0"]
# Web crawler
crawler = ["crawl4ai>=0.4.0"]
# Knowledge graph
graph = ["networkx>=3.0"]
# All extras
all = [
    "fsspec>=2023.1.0", "s3fs>=2023.1.0", "gcsfs>=2023.1.0", "adlfs>=2023.1.0",
    "supabase>=2.0.0", "pinecone-client>=3.0.0", "psycopg2-binary>=2.9.0", "pgvector>=0.2.0",
    "crawl4ai>=0.4.0",
    "networkx>=3.0",
]
dev = [
    # Testing
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    # Code Quality
    "ruff",
    "mypy",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/hemanth/ragi"
Documentation = "https://github.com/hemanth/ragi#readme"
Repository = "https://github.com/hemanth/ragi"
Issues = "https://github.com/hemanth/ragi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/piragi"]

# =============================================================================
# RUFF Configuration (handles both linting AND formatting)
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# MYPY Configuration
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "lancedb.*",
    "sentence_transformers.*",
    "crawl4ai.*",
    "pinecone.*",
    "supabase.*",
    "pysbd.*",
    "markitdown.*",
    "requests.*",
    "networkx.*",
    "fsspec.*",
    "sklearn.*",
    "psycopg2.*",
    "pgvector.*",
    "streamlit.*",
    "psutil.*",
]
ignore_missing_imports = true

# Relaxed rules for tests and examples
[[tool.mypy.overrides]]
module = [
    "tests.*",
    "examples.*",
    "ui.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

# =============================================================================
# PYTEST Configuration
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=piragi --cov-report=term-missing"
